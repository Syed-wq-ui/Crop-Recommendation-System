<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌾 Crop Recommendation System</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:      #2d6a4f;
      --green-lt:   #52b788;
      --green-pale: #d8f3dc;
      --earth:      #b7832f;
      --cream:      #fefae0;
      --dark:       #1b1b1b;
      --card-bg:    #ffffff;
      --radius:     18px;
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      color: var(--dark);
      background-image:
        radial-gradient(ellipse at 10% 20%, #b7e4c720 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, #d4a05720 0%, transparent 50%);
    }

    header {
      text-align: center;
      padding: 56px 24px 32px;
      animation: fadeDown .7s ease both;
    }
    header .badge {
      display: inline-block;
      background: var(--green-pale);
      color: var(--green);
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 6px 18px;
      border-radius: 100px;
      margin-bottom: 18px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 900;
      line-height: 1.1;
      color: var(--green);
    }
    header h1 span { color: var(--earth); }
    header p {
      margin-top: 12px;
      font-size: 1rem;
      color: #555;
      max-width: 480px;
      margin-inline: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 4px 40px #0000000d, 0 1px 4px #00000008;
      max-width: 680px;
      margin: 0 auto 40px;
      padding: 40px;
      animation: fadeUp .7s .15s ease both;
    }
    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--green);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #888;
    }
    .field label span { font-weight: 400; color: #bbb; margin-left: 4px; }
    .field input {
      border: 1.5px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: .97rem;
      font-family: inherit;
      background: #fafafa;
      transition: border .2s, box-shadow .2s;
      outline: none;
    }
    .field input:focus {
      border-color: var(--green-lt);
      box-shadow: 0 0 0 3px #52b78820;
      background: #fff;
    }

    .btn {
      margin-top: 28px;
      width: 100%;
      padding: 16px;
      background: var(--green);
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      letter-spacing: .04em;
      transition: background .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 20px #2d6a4f30;
    }
    .btn:hover  { background: #235540; box-shadow: 0 6px 24px #2d6a4f40; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    #result { display: none; animation: fadeUp .5s ease both; }
    .result-hero {
      text-align: center;
      padding: 32px 0 24px;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 24px;
    }
    .crop-emoji { font-size: 4rem; line-height: 1; margin-bottom: 10px; }
    .crop-name {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--green);
      text-transform: capitalize;
    }
    .confidence-bar-wrap {
      margin-top: 16px;
      background: var(--green-pale);
      border-radius: 100px;
      height: 10px;
      overflow: hidden;
    }
    .confidence-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green-lt), var(--green));
      border-radius: 100px;
      transition: width 1s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    .confidence-label { margin-top: 8px; font-size: .85rem; color: #666; }
    .confidence-label strong { color: var(--green); }

    .top3-title {
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 14px;
    }
    .top3-list { display: flex; flex-direction: column; gap: 10px; }
    .top3-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8faf8;
      border-radius: 10px;
      padding: 10px 16px;
    }
    .top3-item .t-name { font-weight: 500; text-transform: capitalize; }
    .top3-item .t-pct  { color: var(--green); font-weight: 600; font-size: .95rem; }

    .error-box {
      background: #fff0f0;
      border: 1.5px solid #ffcccc;
      border-radius: 10px;
      padding: 14px 18px;
      color: #c0392b;
      font-size: .9rem;
      margin-top: 16px;
      display: none;
    }

    .loader { display: none; justify-content: center; margin-top: 20px; }
    .loader span {
      width: 10px; height: 10px;
      background: var(--green-lt);
      border-radius: 50%;
      display: inline-block;
      margin: 0 4px;
      animation: bounce .6s infinite alternate;
    }
    .loader span:nth-child(2) { animation-delay: .2s; }
    .loader span:nth-child(3) { animation-delay: .4s; }

    footer { text-align: center; padding: 20px; font-size: .8rem; color: #bbb; }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
    @keyframes bounce   { from { transform:translateY(0); } to { transform:translateY(-10px); } }
  </style>
</head>
<body>

<header>
  <div class="badge">🌱 AI Powered</div>
  <h1>Crop <span>Recommendation</span><br>System</h1>
  <p>Enter your soil and weather data to get the best crop suggestion for your field.</p>
</header>

<div class="card">
  <h2>🧪 Enter Soil & Weather Details</h2>
  <div class="grid">
    <div class="field">
      <label>Nitrogen (N) <span>kg/ha</span></label>
      <input type="number" id="N" placeholder="e.g. 117" step="any"/>
    </div>
    <div class="field">
      <label>Phosphorus (P) <span>kg/ha</span></label>
      <input type="number" id="P" placeholder="e.g. 32" step="any"/>
    </div>
    <div class="field">
      <label>Potassium (K) <span>kg/ha</span></label>
      <input type="number" id="K" placeholder="e.g. 34" step="any"/>
    </div>
    <div class="field">
      <label>Temperature <span>°C</span></label>
      <input type="number" id="temperature" placeholder="e.g. 26.2" step="any"/>
    </div>
    <div class="field">
      <label>Humidity <span>%</span></label>
      <input type="number" id="humidity" placeholder="e.g. 52.1" step="any"/>
    </div>
    <div class="field">
      <label>pH Value</label>
      <input type="number" id="ph" placeholder="e.g. 6.7" step="any"/>
    </div>
    <div class="field" style="grid-column: span 2;">
      <label>Rainfall <span>mm</span></label>
      <input type="number" id="rainfall" placeholder="e.g. 127.1" step="any"/>
    </div>
  </div>

  <button class="btn" onclick="predict()">🌾 Recommend Crop</button>
  <div class="loader" id="loader">
    <span></span><span></span><span></span>
  </div>
  <div class="error-box" id="errorBox"></div>
</div>

<div class="card" id="result">
  <div class="result-hero">
    <div class="crop-emoji" id="cropEmoji">🌾</div>
    <div class="crop-name" id="cropName">—</div>
    <div class="confidence-bar-wrap">
      <div class="confidence-bar" id="confBar"></div>
    </div>
    <div class="confidence-label">
      Confidence: <strong id="confText">—</strong>
    </div>
  </div>
  <div class="top3-title">Top 3 Candidates</div>
  <div class="top3-list" id="top3List"></div>
</div>

<footer>Built with Flask &amp; scikit-learn 🌿</footer>

<script>
  async function predict() {
    const ids = ['N','P','K','temperature','humidity','ph','rainfall'];
    const data = {};

    for (const id of ids) {
      const val = document.getElementById(id).value.trim();
      if (val === '') { showError(`Please fill in the ${id} field.`); return; }
      data[id] = val;
    }

    hideError();
    showLoader(true);
    document.getElementById('result').style.display = 'none';

    try {
      const res  = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error);

      document.getElementById('cropEmoji').textContent = json.emoji;
      document.getElementById('cropName').textContent  = json.crop;
      document.getElementById('confText').textContent  = json.confidence + '%';
      document.getElementById('result').style.display  = 'block';

      setTimeout(() => {
        document.getElementById('confBar').style.width = json.confidence + '%';
      }, 100);

      const list = document.getElementById('top3List');
      list.innerHTML = '';
      json.top3.forEach(item => {
        list.innerHTML += `
          <div class="top3-item">
            <span class="t-name">${item.crop}</span>
            <span class="t-pct">${item.probability}%</span>
          </div>`;
      });

    } catch (err) {
      showError('Prediction failed: ' + err.message);
    } finally {
      showLoader(false);
    }
  }

  function showLoader(on) {
    document.getElementById('loader').style.display = on ? 'flex' : 'none';
    document.querySelector('.btn').disabled = on;
  }
  function showError(msg) {
    const b = document.getElementById('errorBox');
    b.textContent = '⚠️ ' + msg;
    b.style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorBox').style.display = 'none';
  }
</script>

</body>
</html>
